<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171814">
    <title>Your exhibit — Oddly Specific</title>
    <style>
        :root { color-scheme: dark; --ink: #f4f0e7; --muted: #aaa99f; --lime: #d4f16a; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; padding: 30px; display: grid; place-items: center;
            color: var(--ink); background: #171814;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page { width: min(100%, 1080px); }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
        .brand { margin: 0; color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
        .back { color: var(--lime); font-size: .86rem; text-decoration: none; }
        .back:hover { text-decoration: underline; text-underline-offset: 4px; }
        .back:focus-visible { outline: 2px solid var(--lime); outline-offset: 5px; }
        .exhibit {
            min-height: min(72vh, 650px); display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .85fr);
            overflow: hidden; border: 1px solid rgba(244, 240, 231, .16); border-radius: 18px;
            background: #25251f; box-shadow: 0 28px 90px rgba(0, 0, 0, .38);
        }
        figure { position: relative; min-height: 480px; margin: 0; overflow: hidden; }
        figure img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
        figure::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0, 0, 0, .56)); }
        figcaption { position: absolute; z-index: 1; right: 28px; bottom: 24px; left: 28px; color: rgba(255, 255, 255, .86); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
        .vertical-copy {
            display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 18px; padding: 36px;
            border-left: 1px solid rgba(244, 240, 231, .14); background: #25251f;
        }
        .vertical-copy h1 {
            margin: 0; color: var(--lime); font-size: .62rem; font-weight: 750;
            letter-spacing: .18em; text-transform: uppercase;
        }
        .lorem {
            max-width: 38ch; margin: 0; color: var(--ink); font-family: Georgia, "Times New Roman", serif;
            font-size: 1.1rem; line-height: 1.65; overflow-wrap: anywhere;
        }
        @media (max-width: 620px) {
            body { padding: 18px; }
            .exhibit { min-height: 0; grid-template-columns: 1fr; }
            figure { min-height: 52vh; }
            .vertical-copy { gap: 12px; padding: 24px 20px; border-top: 1px solid rgba(244, 240, 231, .14); border-left: 0; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <p class="brand">Oddly Specific · Exhibit 01</p>
            <a class="back" href="{{ url_for('index') }}">← Create another</a>
        </header>
        <section class="exhibit" aria-label="Photo and sample text exhibit">
            <figure>
                <img src="{{ url_for('static', filename='wpp.jpg') }}" alt="A woman caught in a dramatic, windblown moment">
                <figcaption>Inspired by: {{ prompt }}</figcaption>
            </figure>
            <aside class="vertical-copy" aria-label="Lorem Ipsum sample">
                <h1>Exhibit text</h1>
                <p class="lorem">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
            </aside>
        </section>
    </main>
</body>
</html>
